version: '3.8'

services:
  # Service untuk Web Next.js kamu
  web-app:
    build: .
    container_name: belajar-net-app
    ports:
      - "3000:3000"
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G # RAM 4GB sudah sangat "Sultan" buat Next.js

  # Service untuk Tunnel (Agar domain nempel ke laptop)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: always
    # Perbaikan di baris command di bawah ini:
    command: tunnel --no-autoupdate run --token eyJhIjoiNmMxZjg4YTIzMzU2NmRhNTg2ZWY1OGM3ZWE4OTJhY2QiLCJ0IjoiZDg1ZGMyZjQtMzAyMy00ZDYxLTk3NTYtY2FiMzc3ZjJmZTg2IiwicyI6IlpUSTBZVFkyT1RrdFpEUXlNeTAwTW1OaExUaGlORE10WW1WallUTm1NelF5TldJMCJ9
    depends_on:
      - web-app